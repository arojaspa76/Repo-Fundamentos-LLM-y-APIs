server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API y health check → contenedor del backend (nombre del servicio en docker-compose)
    location ~ ^/(api|health) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Necesario para que el streaming SSE llegue token a token (sin buffer)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
